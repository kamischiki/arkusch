<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Privacy policy: Arkusch website</title>
  <meta name="theme-color" content="#E8DFD5">
  <link rel="icon" type="image/png" href="images/brand/favicon.png">

  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="fonts/fonts.css">

<body data-title-key="ps.title">
  <header class="site-header">
    <div class="container site-header__inner">
      <a class="brand" href="index.html" aria-label="Arkusch">
        <img class="on-light" src="images/brand/leaf-dark.png" alt="" width="38" height="37">
        <img class="on-dark" src="images/brand/leaf-light.png" alt="" width="38" height="37">
        <span>Arkusch</span>
      </a>
      <div class="header-controls">
        <div class="switch" role="group" data-i18n-aria="lang.label" aria-label="Language">
          <button type="button" data-lang-choice="en" lang="en" aria-label="English">EN</button>
          <button type="button" data-lang-choice="de" lang="de" aria-label="Deutsch">DE</button>
          <button type="button" data-lang-choice="uk" lang="uk" aria-label="Українська">UA</button>
        </div>
        <div class="switch" role="group" data-i18n-aria="theme.label" aria-label="Appearance">
          <button type="button" data-theme-choice="light">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            <span class="visually-hidden" data-i18n="theme.outdoor">Outdoor</span>
          </button>
          <button type="button" data-theme-choice="dark">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
            <span class="visually-hidden" data-i18n="theme.indoor">Indoor</span>
          </button>
        </div>
      </div>
    </div>
  </header>

  <main>
    <article class="legal">
      <div class="container legal__body">
        <h1 data-i18n="ps.title"></h1>
        <p class="legal__meta" data-i18n="ps.updated"></p>
        <p><span data-i18n="ps.intro"></span> <a href="privacy-app.html" data-i18n="ps.intro.link"></a></p>
        <h2 data-i18n="ps.resp.h"></h2>
        <p><span data-i18n="ps.resp.p"></span> <a data-imprint-link href="imprint.html" data-i18n="ps.resp.link"></a></p>
        <h2 data-i18n="ps.host.h"></h2>
        <p><span data-i18n="ps.host.p"></span> <a href="https://docs.github.com/en/site-policy/privacy-policies/github-general-privacy-statement" target="_blank" rel="noopener" data-i18n="ps.host.link"></a></p>
        <h2 data-i18n="ps.nocookie.h"></h2>
        <p><span data-i18n="ps.nocookie.p"></span></p>
        <h2 data-i18n="ps.storage.h"></h2>
        <p><span data-i18n="ps.storage.p"></span></p>
        <h2 data-i18n="ps.media.h"></h2>
        <p><span data-i18n="ps.media.p"></span></p>
        <h2 data-i18n="ps.links.h"></h2>
        <p><span data-i18n="ps.links.p"></span></p>
        <h2 data-i18n="ps.rights.h"></h2>
        <p><span data-i18n="ps.rights.p"></span> <a data-email-link href="#"></a></p>

        <nav class="legal__nav">
          <a href="index.html" data-i18n="legal.back">Back to the start page</a>
          <a href="privacy-app.html" data-i18n="legal.appLink"></a>
        </nav>
      </div>
    </article>
  </main>

  <script src="js/config.js" defer></script>
  <script src="i18n/en.js" defer></script>
  <script src="i18n/de.js" defer></script>
  <script src="i18n/uk.js" defer></script>
  <script src="i18n/legal-en.js" defer></script>
  <script src="i18n/legal-de.js" defer></script>
  <script src="i18n/legal-uk.js" defer></script>
  <script src="js/i18n.js" defer></script>
  <script src="js/stores.js" defer></script>
  <script src="js/reels.js" defer></script>
  <script src="js/main.js" defer></script>
</body>
</html>
